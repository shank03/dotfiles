# Terminal settings
set -s extended-keys on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set-option -g xterm-keys on
set -ga terminal-features 'xterm*:extkeys'
set -gw allow-passthrough on

# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

unbind -n M-j

# Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1

# No escape delay
set -sg escape-time 0

# Mouse support
set -g mouse on

# Vi mode
setw -g mode-keys vi

# History
set -g history-limit 50000

# Renumber windows
# set -g renumber-windows on

# Splits in current directory
bind w split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"

# New window in current directory
bind c new-window -c "#{pane_current_path}"

# Pane navigation without prefix (alt+hjkl)
# bind -n M-h select-pane -L
# bind -n M-j select-pane -D
# bind -n M-k select-pane -U
# bind -n M-l select-pane -R

# Pane navigation with prefix (fallback)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize without prefix (alt+shift+hjkl)
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# Window navigation without prefix
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-n next-window
bind -n M-p previous-window

# Quick actions
bind x kill-pane
bind X kill-window
bind z resize-pane -Z

# Clear terminal
bind -n M-k clear-history

# Session switcher (requires fzf)
bind s display-popup -E -w 40% -h 40% -S "fg=#282828" -b rounded \
    "tmux list-sessions -F '#S' | fzf --reverse --border=none --margin=1 --padding=1 \
    --prompt='  ' --pointer='▌' --no-scrollbar \
    --color=bg:#101010,bg+:#232323,fg:#A0A0A0,fg+:#FFFFFF,hl:#FFC799,hl+:#FFC799,pointer:#FFC799,prompt:#FFC799,info:#5C5C5C \
    | xargs -I{} tmux switch-client -t {}"

# Sessionizer (requires fzf)
bind f display-popup -E -w 50% -h 50% -S "fg=#282828" -b rounded "~/.config/tmux/scripts/sessionizer"

# Last session
bind L switch-client -l

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Copy mode
# bind -T copy-mode-vi v send -X begin-selection
# bind -T copy-mode-vi y send -X copy-selection-and-cancel

# No bells
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# #EAAB7C is 4th midpoint between #FFC799 to #C47A4A
# #E4A475 is 5th ^

# Status bar
set -g status-position top
set -g status-justify left
set -g status-style "fg=#8A8A8A"
set -g status-interval 1

# Status left: session name
set -g status-left "#[fg=#E4A475,bold] #S #[fg=#5C5C5C]│ "
# set -g status-left "#[bold] #S │ "
set -g status-left-length 20

# Status right: time only
set -g status-right "#[fg=#E4A475,bold]%a, %d %b %Y, %-I:%M %p"
# set -g status-right "%a, %d %b %Y, %-I:%M %p"
set -g status-right-length 50

# Window status format
setw -g window-status-format "#[fg=#5C5C5C] #I #W:#{pane_current_command} "
setw -g window-status-current-format "#[fg=#E4A475,bold] [[#I #W:#{pane_current_command}]] "
# setw -g window-status-separator ""
# setw -g window-status-format " #I #W:#{pane_current_command} "
# setw -g window-status-current-format "#[bold] <<#I #W:#{pane_current_command}>> "
setw -g window-status-separator ""

# Pane borders
set -g pane-border-lines single
set -g pane-border-style "fg=#282828"
set -g pane-active-border-style "fg=#E4A475"

# Message style
# set -g message-style "bg=#232323 fg=#FFFFFF"
# set -g message-command-style "bg=#232323 fg=#FFFFFF"

# Mode style (copy mode)
setw -g mode-style "bg=#E4A475 fg=#000000"

# Clock
setw -g clock-mode-colour "#E4A475"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'erikw/tmux-dark-notify'
# set -g @plugin 'briantarqui/vanzi-tmux-theme'

# Plugin settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TPM (keep this at the very bottom)
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
run '~/.tmux/plugins/tpm/tpm'

